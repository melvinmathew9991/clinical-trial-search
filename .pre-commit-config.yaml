# Run `pre-commit install` once (or `make hooks`).
# Rules.md section 6: never bypass with --no-verify.

default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # reference/legacy/ is a frozen record of the code this project
      # replaced. These hooks would rewrite it -- trailing whitespace, final
      # newlines, CRLF -- and a doctored exhibit is worth less than none.
      # detect-private-key and the SAS-token blocker still cover it.
      - id: trailing-whitespace
        exclude: ^reference/legacy/
      - id: end-of-file-fixer
        exclude: ^reference/legacy/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict      # catches FastText-vec vs Fasttext-vec
      - id: detect-private-key
      - id: mixed-line-ending
        exclude: ^reference/legacy/
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=5120]         # artefacts belong in data/ and models/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        exclude: ^reference/legacy/
        args: [--fix]
      - id: ruff-format
        exclude: ^reference/legacy/

  # mypy runs from the PROJECT environment, not a pre-commit sandbox.
  #
  # The mirrors-mypy hook installs its own isolated venv, which cannot
  # practically hold gensim, numpy, pandas-stubs and typer. Without typer it
  # reported every `@app.command()` as an untyped decorator -- 7 false errors
  # that the project mypy does not produce. A local hook has one source of
  # truth and matches exactly what CI runs.
  #
  # Requires the dev extras to be installed: `make setup`.
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (project env)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/medsearch/

  # Rules.md section 3 caps function length; nothing enforced it for eleven
  # sprints, and by Sprint 8 two functions were over the hard cap. Ruff cannot
  # express a line-count rule -- PLR0915 counts statements -- so this is local.
  - repo: local
    hooks:
      - id: function-length
        name: function length (Rules section 3)
        entry: python scripts/check_function_length.py
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/medsearch/

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout            # notebooks are committed without outputs

  - repo: local
    hooks:
      - id: no-azure-sas-tokens
        name: block Azure SAS tokens and account keys
        entry: >-
          bash -c 'if grep -rInE "sig=[A-Za-z0-9%+/]{20,}|sp=r[acwdlmeop]{2,}&|AccountKey=" "$@"; then
          echo "Credential detected. See Rules.md section 0 rule 3."; exit 1; fi' --
        language: system
        types: [text]
        exclude: ^\.pre-commit-config\.yaml$|^\.github/workflows/ci\.yml$
