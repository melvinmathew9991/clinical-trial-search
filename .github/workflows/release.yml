name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist
      # The wheel is what the Databricks job task installs, so it is a
      # release artefact in its own right, not just a packaging by-product.
      - uses: actions/upload-artifact@v4
        with:
          name: medsearch-wheel
          path: dist/*

  image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: wheel
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image serves under a 2 GB limit
        run: |
          set -euo pipefail
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name medsearch-check --memory=2g -p 8501:8501 "$tag"
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:8501/_stcore/health >/dev/null; then
              echo "Healthy."
              docker rm -f medsearch-check
              exit 0
            fi
            sleep 2
          done
          echo "::error::Image failed to become healthy within 60s"
          docker logs medsearch-check
          exit 1
