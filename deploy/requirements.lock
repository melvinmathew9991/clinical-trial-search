# Exact runtime versions for reproducible builds and deploys.
#
# pyproject.toml carries ranges; this file carries the resolution. The image and
# any deploy install from here, so a rebuild six months from now produces the
# same container as today. Without it the clean-clone check on 2026-08-29 was
# resolving gensim/scipy/pandas afresh every time and happening to get a working
# combination -- gensim has a history of breaking against newer scipy.
#
# Used as a pip *constraint*, not a requirement list: `pip install ".[app]"
# --constraint deploy/requirements.lock` installs what pyproject asks for, at
# these versions, and fails loudly on a genuine conflict rather than silently
# resolving past it.
#
# RESOLVED ON: Windows / CPython 3.10 (the development machine).
# The image is linux/CPython 3.11. Markers differ between the two -- `colorama`
# below is Windows-only and simply will not install on linux, which pip handles,
# but a package that is linux-only would be *missing* here.
#
# Regenerate on the target platform before relying on it for a production
# deploy: `make lock` builds the image and freezes from inside it.
