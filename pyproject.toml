[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medsearch"
version = "0.8.0"
description = "Semantic search over COVID-19 clinical trials using in-domain Word2Vec and FastText embeddings"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Melvin Mathew" }]
keywords = ["nlp", "word2vec", "fasttext", "embeddings", "search", "clinical-trials"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Upper bounds are deliberate. Only numpy was capped before, and the clean-clone
# check on 2026-08-29 resolved gensim 4.4.0 / scipy 1.15.3 / pandas 2.3.3 purely
# by luck -- gensim has a history of breaking against newer scipy, and nothing
# here would have stopped a fresh clone picking up an incompatible pair.
#
# These ranges bound the blast radius; they are not a reproducibility guarantee.
# That is `deploy/requirements.lock`, which pins exact versions and is what the
# image and any deploy install from. Ranges here, exact versions there, is the
# usual application split -- a library would carry only the ranges.
dependencies = [
    "gensim>=4.3.0,<5.0",
    "numpy>=1.24,<2.0",
    "pandas>=2.1,<3.0",
    "nltk>=3.8,<4.0",
    "typer>=0.12,<1.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "psutil>=5.9,<8.0",
    "scipy>=1.10,<2.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.30,<2.0"]
viz = ["scikit-learn>=1.3", "matplotlib>=3.7", "wordcloud>=1.9"]
azure = ["azure-storage-blob>=12.19", "azure-identity>=1.15"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    # Pinned deliberately. Type stubs are not implementation -- a stub release
    # can change what mypy --strict concludes about unchanged source. Leaving
    # these floating made CI fail on 3.11/3.12 while passing locally on 3.10,
    # because Series.tolist() resolves to a different overload between
    # pandas-stubs releases. Bump these on purpose, never incidentally.
    "pandas-stubs==2.3.3.260113",
    "types-psutil==7.2.2.20260518",
]

[project.scripts]
medsearch = "medsearch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medsearch = ["py.typed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming  -> blocks K1/KK style names at the API level
    "UP",        # pyupgrade    -> enforces `X | None` over Optional
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # flake8-use-pathlib -> bans os.path joins (Rules 1)
    "RET",       # return consistency
    "ARG",       # unused arguments
    "PD",        # pandas-vet   -> flags chained assignment, the legacy bug
    "NPY",       # numpy-specific
    "RUF",
]
ignore = [
    "E501",    # line length handled by the formatter
    "PD901",   # `df` is an acceptable name in loader/schema modules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PD", "N802"]
"src/medsearch/app/**" = ["PD"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
files = ["src/medsearch"]
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["gensim.*", "nltk.*", "streamlit.*", "wordcloud.*", "scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# The default invocation is the fast developer loop: unit tests only.
# The 80% coverage gate is enforced on the FULL suite by `make test-all` and
# CI, because pipelines/train.py is only meaningfully covered by the
# integration tests.
# Coverage is deliberately NOT here. Rules.md section 5 caps the default run at
# 30 s; measuring coverage cost ~25 s of a 40.5 s run, breaching the rule for no
# benefit, because the 80% gate is enforced only where `--cov-fail-under` is
# passed -- `make test-all` and CI. Those enable coverage explicitly. The fast
# loop is now ~16 s and the gate is unchanged.
addopts = [
    "-q",
    "--strict-markers",
    "-m", "not slow",
]
markers = [
    "slow: excluded from the default run (full-corpus / training tests)",
    "integration: crosses module boundaries",
]

[tool.coverage.run]
source = ["src/medsearch"]
omit = ["*/app/*", "*/__init__.py"]

# ---------------------------------------------------------------- import-linter
# Enforces the layer model in Architecture.md section 2.
# A violation fails CI. This is what stops the codebase collapsing back into
# the legacy "everything imports everything" shape.
[tool.importlinter]
root_package = "medsearch"

[[tool.importlinter.contracts]]
name = "Layers are strictly ordered"
type = "layers"
# Listed highest to lowest. Modules joined by `|` are siblings in one layer and
# may NOT import each other -- which is why the foundation is four layers here,
# not one. The original single-layer version rejected `runtime -> exceptions`
# and `logging_conf -> runtime`, both of which are correct and intended.
layers = [
    "medsearch.app | medsearch.cli",
    "medsearch.pipelines",
    "medsearch.search",
    "medsearch.embeddings",
    "medsearch.preprocessing | medsearch.data",
    "medsearch.logging_conf",
    "medsearch.runtime",
    "medsearch.exceptions | medsearch.config | medsearch._typing",
]

[[tool.importlinter.contracts]]
name = "Foundation layer never reaches upward"
type = "forbidden"
source_modules = [
    "medsearch.config",
    "medsearch.exceptions",
    "medsearch.runtime",
    "medsearch.logging_conf",
    "medsearch._typing",
]
forbidden_modules = [
    "medsearch.data",
    "medsearch.preprocessing",
    "medsearch.embeddings",
    "medsearch.search",
    "medsearch.app",
    "medsearch.pipelines",
    "medsearch.cli",
]
